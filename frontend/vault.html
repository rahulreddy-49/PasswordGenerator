<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault | CipherVault PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <canvas id="matrix-canvas"></canvas>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand cyber-font" href="index.html">
                <i class="bi bi-shield-lock-fill me-2" style="color: var(--accent-cyan);"></i>CIPHERVAULT
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="generator.html">Generator</a></li>
                    <li class="nav-item"><a class="nav-link" href="analyzer.html">Analyzer</a></li>
                    <li class="nav-item"><a class="nav-link active" href="vault.html">Vault</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 mt-5">
        <div class="reveal d-flex justify-content-between align-items-end mb-5">
            <div>
                <h2 class="cyber-font text-white">ENCRYPTED VAULT</h2>
                <p class="text-secondary small">Hardware-isolated credential storage (Local Emulation).</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-cyber btn-sm" onclick="loadVault()"><i class="bi bi-arrow-clockwise me-1"></i>Sync</button>
                <button class="btn btn-cyber btn-sm" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg me-1"></i>New Entry</button>
            </div>
        </div>

        <div class="reveal">
            <div class="glass-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0" style="--bs-table-bg: transparent;">
                        <thead>
                            <tr class="border-bottom border-white border-opacity-10">
                                <th class="ps-4 py-3 text-muted small font-monospace">SERVICE</th>
                                <th class="py-3 text-muted small font-monospace">IDENTITY</th>
                                <th class="py-3 text-muted small font-monospace">KEY</th>
                                <th class="py-3 text-muted small font-monospace">ENTROPY</th>
                                <th class="pe-4 py-3 text-end text-muted small font-monospace">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="vaultTableBody">
                            <!-- Entries -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card p-4 border-white border-opacity-10">
                <h5 class="cyber-font text-white mb-4">SECURE ATTESTATION</h5>
                <div class="mb-3">
                    <input type="text" id="addSite" class="cyber-input" placeholder="Service (e.g. AWS)">
                </div>
                <div class="mb-3">
                    <input type="text" id="addUsername" class="cyber-input" placeholder="Username / Email">
                </div>
                <div class="mb-4">
                    <input type="password" id="addPassword" class="cyber-input" placeholder="Encrypted Token / Password">
                </div>
                <button class="btn btn-cyber w-100" onclick="addNewEntry()">COMMIT TO STORAGE</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        async function loadVault() {
            const items = await ApiService.getVault();
            const body = document.getElementById('vaultTableBody');
            body.innerHTML = '';
            
            items.forEach(item => {
                body.innerHTML += `
                <tr class="border-bottom border-white border-opacity-5 align-middle">
                    <td class="ps-4 py-4 fw-bold text-white fs-6">
                        <i class="bi bi-globe2 text-cyan me-3"></i>${item.site_name}
                    </td>
                    <td class="text-secondary small font-monospace">${item.username}</td>
                    <td class="text-muted small font-monospace">••••••••••••</td>
                    <td>
                        <div class="badge-cyber" style="width: fit-content;">HIGH</div>
                    </td>
                    <td class="pe-4 text-end">
                        <button class="btn btn-link text-cyan p-0 me-3" onclick="copyValue('${item.password}')"><i class="bi bi-copy"></i></button>
                        <button class="btn btn-link text-danger p-0" onclick="deleteEntry(${item.id})"><i class="bi bi-trash3"></i></button>
                    </td>
                </tr>`;
            });
            initRevealAnimations();
        }

        function copyValue(val) {
            navigator.clipboard.writeText(val);
            showToast("Copied to clipboard", "info");
        }

        async function deleteEntry(id) {
            await ApiService.deletePassword(id);
            loadVault();
            showToast("Entry purged", "success");
        }

        async function addNewEntry() {
            const data = {
                site_name: document.getElementById('addSite').value,
                username: document.getElementById('addUsername').value,
                password: document.getElementById('addPassword').value,
                category: 'General'
            };
            await ApiService.savePassword(data);
            bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
            loadVault();
            showToast("Identity secured", "success");
        }

        document.addEventListener('DOMContentLoaded', loadVault);
    </script>
</body>
</html>
