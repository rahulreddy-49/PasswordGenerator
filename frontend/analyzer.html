<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzer | CipherVault PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <canvas id="matrix-canvas"></canvas>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand cyber-font" href="index.html">
                <i class="bi bi-shield-lock-fill me-2" style="color: var(--accent-cyan);"></i>CIPHERVAULT
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="generator.html">Generator</a></li>
                    <li class="nav-item"><a class="nav-link active" href="analyzer.html">Analyzer</a></li>
                    <li class="nav-item"><a class="nav-link" href="vault.html">Vault</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 mt-5">
        <div class="reveal max-width-700 mx-auto text-center mb-5">
            <span class="badge-cyber mb-3">INTELLIGENCE SCAN</span>
            <h2 class="cyber-font text-white">VULNERABILITY ASSESSMENT</h2>
            <p class="text-secondary small">Identify cryptographic weaknesses and exposure risks.</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-8 mx-auto">
                <div class="reveal">
                    <div class="glass-card mb-4">
                        <div class="mb-4">
                            <label class="text-secondary small font-monospace mb-2">TARGET SEQUENCE</label>
                            <div class="position-relative">
                                <input type="password" id="passToAnalyze" class="cyber-input py-3 pe-5 fs-4" placeholder="Enter key to analyze...">
                                <i class="bi bi-eye position-absolute end-0 top-50 translate-middle-y me-3 cursor-pointer text-muted" id="toggleIcon" onclick="togglePass()"></i>
                            </div>
                        </div>
                        <button class="btn btn-cyber w-100 py-3" onclick="analyze()">
                            <i class="bi bi-search me-2"></i>INITIATE SCAN
                        </button>
                    </div>
                </div>

                <div id="results" class="reveal mt-4" style="display: none;">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="glass-card p-4 h-100">
                                <h6 class="text-muted small mb-3">STRENGTH SCORE</h6>
                                <div class="d-flex align-items-center gap-4">
                                    <h1 id="scoreDisplay" class="display-3 mb-0">0</h1>
                                    <div class="flex-grow-1">
                                        <div class="progress" style="height: 10px; background: rgba(255,255,255,0.05); border-radius: 99px;">
                                            <div id="scoreBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                                        </div>
                                        <p id="complexityText" class="small mt-2 mb-0 fw-bold">Calculating...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="glass-card p-4 h-100">
                                <h6 class="text-muted small mb-3">CRACK LATENCY</h6>
                                <h2 id="crackTime" class="text-info-emphasis mb-1 font-monospace">0.00s</h2>
                                <p class="small text-muted mb-0">Estimated brute-force time (10B/s)</p>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="glass-card p-4">
                                <h6 class="text-muted small mb-3">ENGINE FINDINGS</h6>
                                <div id="feedbackContainer">
                                    <ul id="feedbackList" class="list-unstyled mb-0">
                                        <!-- Feedback -->
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        function togglePass() {
            const el = document.getElementById('passToAnalyze');
            const icon = document.getElementById('toggleIcon');
            if(el.type === 'password') {
                el.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                el.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        async function analyze() {
            const pass = document.getElementById('passToAnalyze').value;
            if(!pass) return showToast("Sequence required", "warning");

            const res = await ApiService.analyzePassword(pass);
            document.getElementById('results').style.display = 'block';

            // Score Logic
            const score = res.score;
            document.getElementById('scoreDisplay').innerText = score;
            const bar = document.getElementById('scoreBar');
            bar.style.width = (score / 4 * 100) + '%';
            
            const classes = ['bg-danger', 'bg-warning', 'bg-info', 'bg-primary', 'bg-success'];
            bar.className = 'progress-bar progress-bar-striped progress-bar-animated ' + classes[score];
            
            const labels = ['CRITICAL VULNERABILITY', 'WEAK SECURITY', 'MODERATE ENTROPY', 'STRONG SECURITY', 'EXEMPLARY PROTECTION'];
            const textEl = document.getElementById('complexityText');
            textEl.innerText = labels[score];
            textEl.className = 'small mt-2 mb-0 fw-bold ' + ['text-danger','text-warning','text-info','text-primary','text-success'][score];

            document.getElementById('crackTime').innerText = res.crack_times_display.offline_fast_hashing_1e10_per_second;

            // Feedback
            const list = document.getElementById('feedbackList');
            list.innerHTML = '';
            if(res.feedback.warning) {
                list.innerHTML += `<li class="d-flex gap-2 text-danger mb-3 p-2 bg-danger bg-opacity-10 rounded border border-danger border-opacity-20">
                    <i class="bi bi-exclamation-octagon-fill"></i>
                    <span class="small">${res.feedback.warning}</span>
                </li>`;
            }
            res.feedback.suggestions.forEach(s => {
                list.innerHTML += `<li class="d-flex gap-2 text-secondary mb-2 small">
                    <i class="bi bi-info-circle text-info"></i>
                    <span>${s}</span>
                </li>`;
            });
            if(res.feedback.suggestions.length === 0 && !res.feedback.warning) {
                list.innerHTML = '<li class="text-success small"><i class="bi bi-check-circle-fill me-2"></i>No vulnerabilities detected.</li>';
            }

            // Animate items
            initRevealAnimations();
            showToast("Analysis complete", "success");
        }
    </script>
</body>
</html>
